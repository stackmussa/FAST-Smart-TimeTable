name: Sync Timetable

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Run timetable scraper
        run: python fetch_timetable.py

      - name: Commit and Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the data files
          git add frontend/public/computing.json \
                  frontend/public/engineering.json \
                  frontend/public/management.json \
                  frontend/public/sync_metadata.json

          # Porcelain diff check — only commit if staged changes exist
          if [ -n "$(git status --porcelain frontend/public/)" ]; then
            git commit -m "Auto-sync: Update timetable data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No data changes detected — skipping commit."
          fi
