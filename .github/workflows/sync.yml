name: Sync Timetable

on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl beautifulsoup4 playwright
          playwright install chromium

      - name: Run timetable scraper
        run: |
          python fetch_timetable.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/timetable.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update timetable.json [skip ci]" && git push)
