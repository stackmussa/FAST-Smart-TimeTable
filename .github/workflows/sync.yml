name: Sync Timetable

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_PAT }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Run timetable scraper
        id: scraper
        run: |
          set +e  # Don't exit on non-zero — we handle it manually
          python fetch_timetable.py
          EXIT_CODE=$?
          set -e

          echo "=== Scraper exited with code: $EXIT_CODE ==="

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "CHANGES_FOUND=false" >> "$GITHUB_ENV"
            echo "Scraper exited 0 — no timetable changes detected."
          elif [ "$EXIT_CODE" -eq 1 ]; then
            echo "CHANGES_FOUND=true" >> "$GITHUB_ENV"
            echo "Scraper exited 1 — changes detected, proceeding to commit."
          else
            echo "::error::Scraper crashed with unexpected exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Debug — show git status before commit
        if: env.CHANGES_FOUND == 'true'
        run: |
          echo "=== git status ==="
          git status
          echo ""
          echo "=== git diff --stat ==="
          git diff --stat
          echo ""
          echo "=== Changed files (porcelain) ==="
          git status --porcelain
          echo ""
          echo "=== Override files check ==="
          ls -la .github/scraper_overrides/ 2>/dev/null || echo "No overrides directory found!"
          echo ""
          echo "=== sync_metadata.json ==="
          cat frontend/public/sync_metadata.json 2>/dev/null || echo "No sync_metadata.json found!"

      - name: Determine changed schools and build commit message
        if: env.CHANGES_FOUND == 'true'
        run: |
          # Read the changed_schools array from sync_metadata.json
          CHANGED_SCHOOLS=$(python3 -c "
          import json, sys
          try:
              with open('frontend/public/sync_metadata.json') as f:
                  meta = json.load(f)
              schools = meta.get('changed_schools', [])
              print(', '.join(s.capitalize() for s in schools))
          except Exception as e:
              print('Unknown')
          ")

          # Count status-level changes (Cancelled / Rescheduled) for commit message detail
          STATUS_COUNT=$(python3 -c "
          import json
          try:
              with open('frontend/public/sync_metadata.json') as f:
                  meta = json.load(f)
              sc = meta.get('status_changes', [])
              cancelled = sum(1 for s in sc if s.get('field') == 'is_cancelled' and s.get('new'))
              rescheduled = sum(1 for s in sc if s.get('field') == 'is_rescheduled' and s.get('new'))
              parts = []
              if cancelled: parts.append(f'{cancelled} cancelled')
              if rescheduled: parts.append(f'{rescheduled} rescheduled')
              print(', '.join(parts) if parts else '')
          except:
              print('')
          ")

          if [ -n "$STATUS_COUNT" ]; then
            COMMIT_MSG="Auto-sync: $CHANGED_SCHOOLS — $STATUS_COUNT ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          else
            COMMIT_MSG="Auto-sync: Updates detected in $CHANGED_SCHOOLS ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          fi

          echo "COMMIT_MSG=$COMMIT_MSG" >> "$GITHUB_ENV"
          echo "Commit message: $COMMIT_MSG"

      - name: Stage only changed school files and commit
        if: env.CHANGES_FOUND == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Identify which specific data files were actually modified by the scraper
          CHANGED_DATA_FILES=""

          for FILE in \
            frontend/public/computing.json \
            frontend/public/management.json \
            frontend/public/engineering.json \
            frontend/public/sync_metadata.json; do
            # Check if the file is modified or new according to git
            STATUS=$(git status --porcelain "$FILE" 2>/dev/null | cut -c1-2 | tr -d ' ')
            if [ -n "$STATUS" ]; then
              git add "$FILE"
              CHANGED_DATA_FILES="$CHANGED_DATA_FILES $FILE"
              echo "Staged: $FILE (git status: $STATUS)"
            else
              echo "Skipped (unchanged in git): $FILE"
            fi
          done

          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "$COMMIT_MSG"
            git pull --rebase origin main
            git push origin main
            echo "Successfully committed and pushed:$CHANGED_DATA_FILES"
          else
            echo "Scraper signaled changes but git sees none — safe no-op, skipping commit."
          fi
